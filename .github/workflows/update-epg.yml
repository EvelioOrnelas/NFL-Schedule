name: Update NFL EPG

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 6 AM Mountain (5 AM after clocks fall back)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate EPG
        run: python generate_epg.py
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
      - name: Commit if changed
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add nfl_epg.xml
          git diff --cached --quiet || (git commit -m "Update NFL EPG" && git push)
